name: Android UI acceptance

on:
  workflow_dispatch:
  push:
    branches: [master, main, 'codex/**']
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/android-ui.yml'
      - '.github/scripts/android-ui-test.sh'

permissions:
  contents: read

jobs:
  isolated-ui:
    name: Synthetic ledger on Android 11
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      # Required by the emulator action's documented Linux setup.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test isolated application and collect design previews
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/android-ui-test.sh
      - name: Keep test evidence and synthetic previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhiyu-ui-acceptance
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/design-review/
